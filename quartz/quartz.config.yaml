# yaml-language-server: $schema=./quartz/plugins/quartz-plugins.schema.json
configuration:
  pageTitle: Fog Project Documentation (FOG Docs)
  pageTitleSuffix: ""
  enableSPA: true
  enablePopovers: true
  locale: en-US
  baseUrl: docs.fogproject.org/en/latest
  ignorePatterns:
    - private
    - templates
    - .obsidian
  theme:
    fontOrigin: googleFonts
    cdnCaching: true
    typography:
      header: Roboto
      body: Roboto
      code: Roboto Mono
    colors:
      # Approximates mkdocs-material's "indigo" primary/accent palette
      # (docs/.obsidian/appearance.json has no saved theme to port instead).
      lightMode:
        light: "#ffffff"
        lightgray: "#e8eaf6"
        gray: "#9fa8da"
        darkgray: "#333333"
        dark: "#212121"
        secondary: "#3f51b5"
        tertiary: "#5c6bc0"
        highlight: rgba(63, 81, 181, 0.15)
        textHighlight: "#fff59d88"
      darkMode:
        light: "#22232e"
        lightgray: "#32333f"
        gray: "#5c6bc0"
        darkgray: "#c9cdff"
        dark: "#eef0ff"
        secondary: "#8c9eff"
        tertiary: "#7986cb"
        highlight: rgba(140, 158, 255, 0.15)
        textHighlight: "#fff59d88"
plugins:
  - source: "@quartz-community/created-modified-date"
    enabled: true
    options:
      defaultDateType: modified
      priority:
        - frontmatter
        - git
        - filesystem
    order: 10
  - source: "@quartz-community/syntax-highlighting"
    enabled: true
    options:
      theme:
        light: github-light
        dark: github-dark
      keepBackground: false
    order: 20
  - source: "@quartz-community/obsidian-flavored-markdown"
    enabled: true
    options:
      enableInHtmlEmbed: false
      enableCheckbox: true
    order: 30
  - source: "@quartz-community/github-flavored-markdown"
    enabled: true
    order: 40
  - source: "@quartz-community/table-of-contents"
    enabled: true
    order: 50
    layout:
      position: right
      priority: 30
  - source: "@quartz-community/crawl-links"
    enabled: true
    options:
      markdownLinkResolution: shortest
    order: 60
  - source: "@quartz-community/description"
    enabled: true
    order: 70
  - source: "@quartz-community/latex"
    enabled: true
    options:
      renderEngine: katex
    order: 80
  - source: "@quartz-community/citations"
    enabled: false
    order: 85
  - source: "@quartz-community/hard-line-breaks"
    enabled: false
    order: 90
  - source: "@quartz-community/ox-hugo"
    enabled: false
    order: 91
  - source: "@quartz-community/roam"
    enabled: false
    order: 92
  - source: "@quartz-community/quartz-fonts"
    enabled: true
  - source: "@quartz-themes/core"
    enabled: false
    options:
      theme: tokyo-night
      mode: both
  - source: "@quartz-community/remove-draft"
    enabled: true
  - source: "@quartz-community/explicit-publish"
    enabled: false
  - source: "@quartz-community/alias-redirects"
    enabled: true
  - source: "@quartz-community/content-index"
    enabled: true
    options:
      enableSiteMap: true
      enableRSS: true
  - source: "@quartz-community/favicon"
    enabled: true
  - source: "@quartz-community/og-image"
    enabled: true
  - source: "@quartz-community/cname"
    enabled: true
  - source: "@quartz-community/canvas-page"
    enabled: true
  - source: "@quartz-community/content-page"
    enabled: true
  - source: "@quartz-community/folder-page"
    enabled: true
  - source: "@quartz-community/tag-page"
    enabled: true
  # Quartz has no top-tab-bar equivalent to mkdocs-material's navigation.tabs
  # (no full-width region above the 3-column layout exists to put one in).
  # This pins the same top-level sections as a row of pill links directly
  # above the Explorer tree in the left sidebar -- the closest persistent,
  # always-visible surface available -- so they're reachable without
  # expanding the tree, and highlights the section the current page is in.
  - source: "./local-plugins/section-shortcuts"
    enabled: true
    options:
      links:
        - text: Installation
          target: installation/index
        - text: Management
          target: management/index
        - text: Knowledge Base
          target: kb/index
        - text: Development
          target: development/index
        - text: FOG 1.5
          target: 1.5/index
        - text: FOG 1.6
          target: 1.6/index
        - text: Tags
          target: tags/index
    layout:
      position: left
      priority: 40
  - source: "@quartz-community/explorer"
    enabled: true
    options:
      # Keep the 1.5/1.6 version trees out of the sidebar. Their pages are
      # reached through the version chooser that sits at each forked topic's
      # normal place in the tree, through the pinned FOG 1.5 / FOG 1.6 pills
      # above it, and through search. Showing the trees here as well listed
      # every forked page three times -- once as its chooser and once inside
      # each version tree -- which is more nav, not less, and buries the topic
      # tree the choosers exist to restore.
      #
      # Supplying filterFn REPLACES the plugin default, so the "tags" exclusion
      # has to be repeated here or the tag tree comes back.
      #
      # prev-next-nav applies the same exclusion, so Previous/Next cannot walk
      # into a tree the sidebar does not show.
      filterFn: |
        (node) => {
          if (node.slugSegment === "tags") return false
          if (node.slugSegments.length === 1) {
            if (node.slugSegment === "1.5" || node.slugSegment === "1.6") return false
          }
          return true
        }
      # Order top-level folders (installation, management, kb, development,
      # then the 1.5/1.6 version trees); alphabetical otherwise. Also applies
      # an explicit per-directory order for sections where plain alphabetical
      # sort contradicts the docs' own recommended reading order or buries
      # beginner content behind advanced/legacy pages.
      #
      # MUST stay in sync with prev-next-nav's TOP_ORDER / EXPLICIT_ORDER
      # (quartz/local-plugins/prev-next-nav/dist/components/index.js) -- the
      # sortFn is a string inside YAML, so the two cannot share a module.
      # See VERSIONING.md for the check that compares them.
      sortFn: |
        (a, b) => {
          const topOrder = ["installation", "management", "kb", "development", "1.5", "1.6"]
          const rank = (n) => {
            const idx = topOrder.indexOf(n.slugSegment)
            return idx === -1 ? topOrder.length : idx
          }

          const explicitOrder = {
            "installation/network-setup": ["dhcp-server-settings", "proxy-dhcp", "secure-boot-netboot"],
            "installation/server": ["requirements", "install-fog-server", "command-line-options", "migrating-fog-server", "virtualization", "uninstall-fog-server"],
            "kb/how-tos": ["capture-an-image", "deploy-an-image", "fog-client-example-tasks", "change-fog-server-ip-address", "bios-and-uefi-co-existence", "uefi-boot-entries", "deploy-dual-boot-multi-disk-image", "add-extend-a-2nd-virtual-hdd", "post-download-scripts", "secure-boot-signing", "secure-boot-mok-enrollment", "secure-boot-setup-mode-enrollment"],
            "kb/integrations": ["api", "api-expansion-and-pagination", "api-openapi-reference", "external-ca-lets-encrypt"],
            "kb/reference": ["pki-zones", "netboot-transport-and-pki", "pki-glossary", "bringing-your-own-ca", "secure-boot-trust-stores", "secure-boot-technical-details", "csv_import_export", "ping-hosts-service", "referential-integrity"],
            "kb/troubleshooting": ["database-schema-update", "primary-mac-address-issues"],
            "management/fos": ["using-fog-boot-menu"],
            "management/server": ["install-fogsettings", "supported-customizations"],
            "management/web": ["users", "roles", "oidc", "local-login", "ad-integration", "ldap", "site-scoping", "groups", "hosts", "images", "storage-node", "snapins", "printers", "tasks", "multicast", "reports", "dashboard", "service", "config", "certificates", "plugins"],
            "1.5/management/web": ["plugins", "ldap", "site-scoping", "hosts", "groups", "reports", "storage-node", "config", "images", "multicast"],
            "1.5/kb/reference": ["pki-zones", "netboot-transport-and-pki", "pki-glossary", "bringing-your-own-ca", "secure-boot-trust-stores", "secure-boot-technical-details", "csv_import_export", "ping-hosts-service", "referential-integrity"],
            "1.6/management/web": ["plugins", "ldap", "site-scoping", "hosts", "groups", "reports", "storage-node", "config", "images", "multicast"],
            "1.6/kb/reference": ["pki-zones", "netboot-transport-and-pki", "pki-glossary", "bringing-your-own-ca", "secure-boot-trust-stores", "secure-boot-technical-details", "csv_import_export", "ping-hosts-service", "referential-integrity"],
          }

          if (!a.isFolder && !b.isFolder) {
            const parentA = a.slugSegments.slice(0, -1).join("/")
            const parentB = b.slugSegments.slice(0, -1).join("/")
            if (parentA === parentB && explicitOrder[parentA]) {
              const order = explicitOrder[parentA]
              const ra2 = order.indexOf(a.slugSegment)
              const rb2 = order.indexOf(b.slugSegment)
              const rankA = ra2 === -1 ? order.length : ra2
              const rankB = rb2 === -1 ? order.length : rb2
              if (rankA !== rankB) return rankA - rankB
            }
          }

          if (a.isFolder && b.isFolder) {
            const ra = rank(a)
            const rb = rank(b)
            if (ra !== rb) return ra - rb
            return a.displayName.localeCompare(b.displayName, undefined, { numeric: true, sensitivity: "base" })
          }
          if (a.isFolder !== b.isFolder) return a.isFolder ? -1 : 1
          return a.displayName.localeCompare(b.displayName, undefined, { numeric: true, sensitivity: "base" })
        }
    layout:
      position: left
      priority: 50
  - source: "@quartz-community/graph"
    enabled: true
    options:
      # Default (1) only shows a page's direct neighbors, so the graph never
      # reads as a tree -- from the home page it's just a flat star of its
      # immediate links with no further branching. 2 levels shows each
      # top-level section's own subsections too (e.g. home -> installation ->
      # installation/server), which is what actually makes the site's
      # structure visible from the home page.
      localGraph:
        depth: 2
    layout:
      position: right
      priority: 10
  - source: "@quartz-community/search"
    enabled: true
    layout:
      position: left
      priority: 20
      group: toolbar
      groupOptions:
        grow: true
  - source: "@quartz-community/backlinks"
    enabled: true
    layout:
      position: right
      priority: 50
  - source: "@quartz-community/article-title"
    enabled: true
    layout:
      position: beforeBody
      priority: 10
  - source: "@quartz-community/content-meta"
    enabled: true
    layout:
      position: beforeBody
      priority: 20
  - source: "@quartz-community/tag-list"
    enabled: true
    layout:
      position: beforeBody
      priority: 30
  # FOG icon shown above the site title, mirroring mkdocs-material's `theme.logo`.
  # Grouped with page-title into a single "brand" flex column (see layout.groups
  # below) -- Quartz's sidebar has far less horizontal room than mkdocs-material's
  # full-width header bar, so a side-by-side icon+title gets dwarfed/overlapped by
  # the title once it wraps to 2-3 lines. Stacking keeps the icon a fixed, legible
  # size regardless of title length or sidebar width.
  - source: "./local-plugins/site-logo"
    enabled: true
    layout:
      position: left
      priority: 8
      group: brand
  - source: "@quartz-community/page-title"
    enabled: true
    layout:
      position: left
      priority: 10
      group: brand
  - source: "@quartz-community/darkmode"
    enabled: true
    layout:
      position: left
      priority: 30
      group: toolbar
  - source: "@quartz-community/reader-mode"
    enabled: true
    layout:
      position: left
      priority: 35
      group: toolbar
  - source: "@quartz-community/breadcrumbs"
    enabled: true
    layout:
      position: beforeBody
      priority: 5
      condition: not-index
  # Mirrors mkdocs-material's navigation.footer feature (enabled in mkdocs.yml),
  # which renders Previous/Next links at the bottom of the page based on nav
  # order. No @quartz-community plugin does this.
  - source: "./local-plugins/prev-next-nav"
    enabled: true
    layout:
      position: afterBody
      priority: 8
  - source: "@quartz-community/comments"
    enabled: false
    options:
      provider: giscus
      options: {}
    layout:
      position: afterBody
      priority: 10
  - source: "@quartz-community/footer"
    enabled: true
    options:
      links:
        FOG Project GitHub: https://github.com/FOGProject
        Release Notes: https://github.com/FOGProject/fogproject/releases
        Security Advisories: https://github.com/FOGProject/fogproject/security/advisories?state=published
    layout:
      position: footer
      priority: 50
  - source: "@quartz-community/recent-notes"
    enabled: false
  - source: "@quartz-community/spacer"
    enabled: true
    options: {}
    order: 25
    layout:
      position: left
      priority: 25
      display: mobile-only
  - source: "@quartz-community/bases-page"
    enabled: true
    options: {}
    order: 50
  - source: "@quartz-community/note-properties"
    enabled: true
    options:
      includeAll: false
      includedProperties:
        - description
        - tags
        - aliases
      excludedProperties: []
      hidePropertiesView: false
      delimiters: ---
      language: yaml
    order: 5
    layout:
      position: beforeBody
      priority: 15
      display: all
  - source: "@quartz-community/unlisted-pages"
    enabled: true
    options: {}
    order: 45
  - source: "@quartz-community/encrypted-pages"
    enabled: true
    options:
      iterations: 600000
      passwordField: password
      unlistWhenEncrypted: false
      outputPath: static/encryptedContentIndex.json
    order: 900
  - source: "@quartz-community/stacked-pages"
    enabled: false
    layout:
      position: afterBody
      priority: 50
      display: all
  # Local, spike-only plugins replicating fog-docs' context_id short-permalink
  # feature (hook.py's redirect-map generation + overrides/partials/tags.html's
  # visible "Permalink" link). See local-plugins/README.md.
  - source: "./local-plugins/context-id-aliases"
    enabled: true
    order: 6
  - source: "./local-plugins/context-id-permalink"
    enabled: true
    layout:
      position: beforeBody
      priority: 25
  # Mirrors mkdocs-material's content.action.edit/content.action.view
  # (theme.features in mkdocs.yml) — no @quartz-community equivalent exists.
  - source: "./local-plugins/github-source-link"
    enabled: true
    options:
      repoUrl: https://github.com/FOGProject/fog-docs
      branch: master
      contentDir: docs
    layout:
      position: beforeBody
      priority: 26
layout:
  groups:
    brand:
      priority: 10
      direction: row
      gap: 0.1rem
    toolbar:
      priority: 35
      direction: row
      gap: 0.5rem
  byPageType:
    "404":
      positions:
        beforeBody: []
        left: []
        right: []
    content: {}
    folder:
      exclude:
        - reader-mode
      positions:
        right: []
    tag:
      exclude:
        - reader-mode
      positions:
        right: []
    canvas: {}
    bases: {}
