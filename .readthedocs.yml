# .readthedocs.yml
# Read the Docs configuration file — production Quartz build for fog-docs.
# See https://docs.readthedocs.io/en/stable/config-file/v2.html
# and https://docs.readthedocs.io/en/stable/build-customization.html
#
# This site is built with Quartz (see quartz/README.md). Read the Docs has
# no native Quartz/Node-based-generator support, so this fully overrides the
# default build via build.commands: install Node, run Quartz, drop the
# result in $READTHEDOCS_OUTPUT/html for RTD to host.
#
# This was proven out against a side "fog-docs-quartz-test" RTD project
# pointed at the pre-merge quartz-docs branch; the real fog-docs RTD
# project now builds this directly from master.
#
# The build is not inlined here because it has to vary by language.
# Translations are served as one RTD project per language, all pointed at this
# same repo and branch and linked from the parent project's Translations page;
# the only thing that differs between them is the project's Language setting,
# which RTD passes to the build as $READTHEDOCS_LANGUAGE.
# quartz/scripts/rtd-build.mjs reads that, composes the right content tree
# (docs/ with translations/<lang>/ laid over it, so untranslated pages fall
# back to English), builds with the matching Quartz UI locale, and takes
# baseUrl from $READTHEDOCS_CANONICAL_URL rather than a hardcoded value.
#
# It also runs the post-build fix-up that used to be the last command here.
# Quartz's link-resolution core unconditionally strips the .html extension
# when generating internal hrefs (no config toggle for this) — it assumes
# the host does clean-URL rewriting the way GitHub Pages/Cloudflare Pages
# do. RTD's custom build.commands hosting serves by exact path instead, so
# every internal link 404s without it.
# See quartz/scripts/rtd-fix-links.mjs for details.

version: 2

build:
  os: ubuntu-24.04
  tools:
    nodejs: "22"
  commands:
    - cd quartz && npm ci
    - cd quartz && npm run install-plugins
    - cd quartz && node scripts/rtd-build.mjs
